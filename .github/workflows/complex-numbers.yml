name: ComplexNumbers

on:
  push:
    paths:
      - 'ComplexNumbers/**'
      - 'ComplexNumbers.Tests/**'
      - '.github/workflows/complex-numbers.yml'
      - 'global.json'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/[Nn]u[Gg]et.[Cc]onfig'
  pull_request:
    paths:
      - 'ComplexNumbers/**'
      - 'ComplexNumbers.Tests/**'
      - '.github/workflows/complex-numbers.yml'
      - 'global.json'
      - '**/Directory.Build.*'
      - '**/Directory.Packages.props'
      - '**/[Nn]u[Gg]et.[Cc]onfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up build SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ComplexNumbers.Tests/ComplexNumbers.Tests.csproj --packages .packages

      - name: Build
        run: dotnet build ComplexNumbers.Tests/ComplexNumbers.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project ComplexNumbers.Tests/ComplexNumbers.Tests.csproj --no-build --configuration Release
